apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  labels:
    app.kubernetes.io/name: strimzi
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/component: operator
spec:
  project: default
  source:
    chart: strimzi-kafka-operator
    repoURL: quay.io/strimzi-helm
    targetRevision: 1.2.0
    helm:
      releaseName: strimzi
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: kafka
  # The Kafka CRD shipped by the chart declares an empty
  # "status.clusterSecurity.properties: {}". The API server drops empty
  # "properties" maps when it persists a CRD, so the live object never matches
  # what the chart asks for and this Application stays OutOfSync forever -- even
  # though the operator is perfectly Healthy. "argocd app wait" then blocks until
  # the CI job is killed. Ignoring that one path is what makes the sync converge.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jsonPointers:
        - /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
